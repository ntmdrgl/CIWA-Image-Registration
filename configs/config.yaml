defaults:
  - dataset: citrus
  - _self_
  - override hydra/job_logging: disabled # prevents .log generation

optimization:
  algorithm: woa
  metric: mutual_information  # or normalized_mutual_information
  use_distortion: true

  num_images: 10
  use_all_images: false

  epochs: 100
  pop_size: 50
  bins: 64
  seed: 42

  # angle, hx, hy, sx, sy, tx, ty, k1, k2, k3, p1, p2
  lower_bounds: [-1, -0.05, -0.05, 1.0, 1.0, -50, -50, -0.50, -0.30, -0.15, -0.01, -0.01]
  upper_bounds: [ 1,  0.05,  0.05, 1.4, 1.4,  50,  50,  0.50,  0.30,  0.15,  0.01,  0.01]
  
transform: manual

hydra:
  run:
    # dir: runs/${now:%Y-%m-%d_%H-%M-%S} # use if you want to save runs
    dir: .                             # use if you don't want to save runs
