camera:
  name: flir_one_pro
  image_width: 1440
  image_height: 1080
  thermal_width: 640
  thermal_height: 480
  HFOV: 55
  VFOV: 43
dataset:
  name: citrus
  path: data/citrus/train
  is_vertical: true
optimization:
  algorithm: gwo
  metric: mutual_information
  use_distortion: true
  num_images: 10
  use_all_images: false
  epochs: 100
  pop_size: 50
  bins: 64
  seed: 42
  lower_bounds:
  - -1
  - -0.05
  - -0.05
  - 1.0
  - 1.0
  - -50
  - -50
  - -0.5
  - -0.3
  - -0.15
  - -0.01
  - -0.01
  upper_bounds:
  - 1
  - 0.05
  - 0.05
  - 1.4
  - 1.4
  - 50
  - 50
  - 0.5
  - 0.3
  - 0.15
  - 0.01
  - 0.01
transform: citrus_woa_10nmi
